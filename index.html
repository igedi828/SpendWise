
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>SpendWise Budget Tracker</h1>
    <p>Track your income and expenses in one place.</p>

    <section>
        <h2>Add Expense</h2>

        <label for="expense-name">Expense Name</label>
        <input type="text" id="expense-name" placeholder="Enter expense name">

        <label for="amount">Amount (KSH)</label>
        <input type="number" id="amount" placeholder="Enter amount">

        <label for="category">Category</label>
        <input type="text" id="category" placeholder="Enter category">
    </section>

    <section>
        <h2>Your Expenses</h2>

        <table>
            <thead>
                <tr>
                    <th>Expense Name</th>
                    <th>Amount (KSH)</th>
                    <th>Category</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Transport</td>
                    <td>100</td>
                    <td>Travel</td>
                </tr>
                <tr>
                    <td>Lunch</td>
                    <td>200</td>
                    <td>Food</td>
                </tr>
            </tbody>
        </table>
    </section>

</body>
</html>
